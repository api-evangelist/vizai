name: Viz.ai
description: 'Viz.ai is a healthcare AI company that builds an intelligent care coordination
  platform. Its FDA-cleared, AI-powered software analyzes medical imaging (CT, CTA,
  MRI, echocardiography) to detect suspected disease — stroke (large vessel occlusion,
  ICH), aneurysm, pulmonary embolism, and cardiovascular conditions — and automatically
  alerts and connects the multidisciplinary care team in real time to accelerate
  diagnosis and treatment. Backed by CRV, GV, Insight Partners, Scale Venture Partners,
  Seedcamp, Susa Ventures, and Threshold Ventures. Viz.ai exposes no public developer
  API; integration is delivered through clinical/enterprise deployment, and its
  governance-relevant public surface is a Drata-hosted Trust Center documenting a
  broad security and compliance program (SOC 2 Type II, HIPAA, and an extensive ISO
  family including ISO 42001 for AI management).'
